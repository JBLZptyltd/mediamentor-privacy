<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediaMentor — Email confirmed</title>
<style>
  :root { --bg:#010018; --text:#E8EDF2; --dim:#93A4B4; --soft:#B9A7FF; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:32px; text-align:center;
  }
  main { max-width:420px; }
  .tick {
    width:74px; height:74px; margin:0 auto 28px; border-radius:50%;
    background:linear-gradient(135deg,#4b20e8,#8873d8);
    display:flex; align-items:center; justify-content:center;
  }
  .tick svg { width:36px; height:36px; }
  h1 { font-size:27px; margin:0 0 12px; letter-spacing:-.02em; }
  p { margin:0 0 18px; color:var(--dim); }
  strong { color:var(--text); }
  .note { font-size:14px; color:var(--dim); margin-top:34px; }
  a { color:var(--soft); }
</style>
</head>
<body>
<main>
  <div class="tick">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
  </div>

  <h1>You're confirmed</h1>

  <p>That's your email sorted. <strong>Head back to MediaMentor and log in.</strong></p>

  <p class="note">
    You can close this tab.<br>
    Anything wrong? <a href="mailto:mediamentorsupport@gmail.com">mediamentorsupport@gmail.com</a>
  </p>
</main>
</body>
</html>
